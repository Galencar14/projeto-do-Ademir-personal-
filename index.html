<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0f1115">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Meu Treino</title>
  <style>
    :root {
      --bg: #0f1115;
      --card: #181b22;
      --line: #262b36;
      --tx: #eef1f6;
      --mu: #8b93a4;
      --ac: #ff6a1a;
      --ok: #2fbf71;
      --rd: #e5484d
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--tx);
      font: 16px/1.4 system-ui, -apple-system, Segoe UI, Roboto, sans-serif
    }

    header {
      position: sticky;
      top: 0;
      z-index: 5;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 14px;
      background: var(--bg);
      border-bottom: 1px solid var(--line)
    }

    header h2 {
      margin: 0;
      font-size: 18px;
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    main {
      padding: 14px 14px 150px;
      max-width: 720px;
      margin: 0 auto
    }

    nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      display: flex;
      background: #12151b;
      border-top: 1px solid var(--line);
      padding-bottom: env(safe-area-inset-bottom);
      z-index: 6
    }

    nav button {
      flex: 1;
      background: none;
      border: 0;
      color: var(--mu);
      padding: 10px 4px;
      font-size: 12px
    }

    nav button.on {
      color: var(--ac)
    }

    nav button span {
      display: block;
      font-size: 20px
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px;
      margin: 10px 0
    }

    .card.click {
      cursor: pointer
    }

    .card.done {
      border-color: var(--ok)
    }

    .muted {
      color: var(--mu);
      font-size: 14px
    }

    .btn {
      display: block;
      width: 100%;
      background: var(--ac);
      color: #fff;
      border: 0;
      border-radius: 12px;
      padding: 13px;
      font-size: 16px;
      font-weight: 600;
      margin: 10px 0
    }

    .btn.sec {
      background: #262b36
    }

    .btn.red {
      background: var(--rd)
    }

    .btn.sm,
    .sm {
      padding: 8px 12px;
      font-size: 14px;
      width: auto;
      display: inline-block;
      margin: 4px 4px 0 0
    }

    a.btn {
      text-decoration: none;
      text-align: center
    }

    .ico {
      background: #262b36;
      color: var(--tx);
      border: 0;
      border-radius: 10px;
      min-width: 38px;
      height: 38px;
      font-size: 18px
    }

    .ico.sm {
      min-width: 32px;
      height: 32px;
      font-size: 14px;
      padding: 0
    }

    .link {
      background: none;
      border: 0;
      color: var(--mu);
      padding: 10px;
      width: 100%
    }

    input,
    textarea,
    select {
      width: 100%;
      background: #0f1115;
      color: var(--tx);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 11px;
      font-size: 16px;
      margin: 4px 0 8px;
      font-family: inherit
    }

    label {
      font-size: 13px;
      color: var(--mu);
      display: block
    }

    .row {
      display: flex;
      align-items: center;
      gap: 8px
    }

    .grow {
      flex: 1
    }

    .grid4 {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px
    }

    .grid4 input {
      padding: 9px 6px;
      text-align: center
    }

    .tag {
      background: #262b36;
      color: var(--mu);
      border-radius: 20px;
      padding: 2px 10px;
      font-size: 12px;
      white-space: nowrap
    }

    .chips {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding: 4px 0 8px
    }

    .chips button {
      flex: none;
      background: #262b36;
      color: var(--tx);
      border: 0;
      border-radius: 20px;
      padding: 7px 13px;
      font-size: 14px
    }

    .chips button.on {
      background: var(--ac)
    }

    .hidden {
      display: none
    }

    .det {
      margin-top: 10px;
      font-size: 15px
    }

    .det p {
      margin: 6px 0
    }

    .login {
      max-width: 380px;
      margin: 0 auto;
      padding: 60px 20px
    }

    .login h1 {
      font-size: 30px;
      margin: 0 0 6px
    }

    .ov {
      position: fixed;
      inset: 0;
      background: #000a;
      z-index: 20;
      display: flex;
      align-items: flex-end;
      justify-content: center
    }

    .sheet {
      background: var(--bg);
      border-radius: 18px 18px 0 0;
      width: 100%;
      max-width: 720px;
      max-height: 90vh;
      overflow: auto;
      padding: 16px 16px 28px;
      border: 1px solid var(--line)
    }

    .sheet h3 {
      margin: 0 0 10px
    }

    .savebar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: calc(58px + env(safe-area-inset-bottom));
      padding: 8px 14px;
      background: linear-gradient(transparent, var(--bg) 40%);
      z-index: 5;
      max-width: 720px;
      margin: 0 auto
    }

    .savebar .btn {
      margin: 0
    }

    #toast {
      position: fixed;
      left: 50%;
      bottom: 110px;
      transform: translateX(-50%);
      background: #fff;
      color: #000;
      padding: 10px 16px;
      border-radius: 20px;
      font-size: 14px;
      z-index: 40;
      opacity: 0;
      transition: .25s;
      pointer-events: none;
      max-width: 90%;
      text-align: center
    }

    #toast.on {
      opacity: 1
    }

    .chk {
      width: 26px;
      height: 26px;
      accent-color: var(--ok);
      margin: 0;
      flex: none
    }

    .pill {
      display: inline-block;
      background: #262b36;
      border-radius: 8px;
      padding: 3px 9px;
      margin: 2px 4px 2px 0;
      font-size: 13px
    }
  </style>
</head>

<body>
  <div id="app"></div>
  <div id="modal"></div>
  <div id="toast"></div>

    const GROUPS = ['Peito', 'Costas', 'Ombros', 'Bíceps', 'Tríceps', 'Antebraço', 'Quadríceps', 'Posterior de coxa', 'Glúteos', 'Panturrilha', 'Abdômen', 'Cardio', 'Funcional e mobilidade'];

    const RAW = `Peito|Supino reto com barra|Barra e banco|Deite com pés firmes no chão e escápulas juntas. Desça a barra até a linha do peito e empurre até estender os braços sem travar os cotovelos.
Peito|Supino inclinado com barra|Barra e banco inclinado|Banco a 30-45°. Desça a barra até a parte alta do peito e empurre para cima mantendo punhos alinhados com os cotovelos.
Peito|Supino declinado com barra|Barra e banco declinado|Prenda os pés no apoio. Desça a barra até a parte baixa do peito e empurre de volta de forma controlada.
Peito|Supino reto com halteres|Halteres e banco|Halteres na altura do peito, cotovelos a cerca de 45° do corpo. Empurre para cima aproximando os halteres sem bater um no outro.
Peito|Supino inclinado com halteres|Halteres e banco inclinado|Banco a 30°. Desça os halteres até alongar o peito e suba em arco, contraindo a parte superior do peitoral.
Peito|Supino na máquina (chest press)|Máquina|Ajuste o banco para que as pegadas fiquem na altura do meio do peito. Empurre sem tirar as costas do encosto e retorne devagar.
Peito|Crucifixo reto com halteres|Halteres e banco|Braços levemente flexionados. Abra em arco até sentir o peito alongar e feche como se abraçasse uma árvore.
Peito|Crucifixo inclinado com halteres|Halteres e banco inclinado|Mesmo movimento do crucifixo reto, com banco a 30°, enfatizando a parte superior do peito.
Peito|Crucifixo na máquina (peck deck)|Máquina|Costas apoiadas, cotovelos na altura dos ombros. Feche os braços à frente contraindo o peito e volte devagar.
Peito|Crossover na polia alta|Polia|Um passo à frente, tronco levemente inclinado. Traga as mãos para baixo e à frente do corpo, cruzando levemente no final.
Peito|Crossover na polia baixa|Polia|Puxe os cabos de baixo para cima até a altura do queixo, focando o peitoral superior.
Peito|Flexão de braço|Peso do corpo|Mãos um pouco mais abertas que os ombros, corpo alinhado. Desça o peito até perto do chão e empurre de volta sem deixar o quadril cair.
Peito|Pullover com halter|Halter e banco|Deitado, segure o halter com as duas mãos acima do peito. Leve-o para trás da cabeça com braços semi-estendidos e volte.
Costas|Puxada frontal na polia (pulley)|Polia alta|Pegada aberta. Puxe a barra até a altura do queixo/clavícula, peito aberto, levando os cotovelos para baixo e para trás.
Costas|Puxada com pegada supinada|Polia alta|Palmas para você, mãos na largura dos ombros. Puxe a barra ao peito, trabalhando também o bíceps.
Costas|Puxada com triângulo|Polia alta e triângulo|Puxe o triângulo até o peito mantendo o tronco levemente inclinado para trás e as escápulas juntas.
Costas|Remada baixa sentada (triângulo)|Polia baixa|Sentado com coluna reta, puxe o triângulo até o abdômen levando os cotovelos para trás. Volte alongando as costas sem arredondar a lombar.
Costas|Remada curvada com barra|Barra|Quadril para trás, tronco quase paralelo ao chão, coluna neutra. Puxe a barra até o abdômen e desça controlando.
Costas|Remada unilateral com halter (serrote)|Halter e banco|Apoie uma mão e joelho no banco. Puxe o halter em direção ao quadril, cotovelo junto ao corpo.
Costas|Remada cavalinho|Barra T ou máquina|Peito alto, coluna neutra. Puxe a pegada em direção ao abdômen e retorne devagar.
Costas|Remada na máquina articulada|Máquina|Peito apoiado no encosto. Puxe as manoplas até as escápulas se aproximarem e volte alongando.
Costas|Barra fixa|Barra fixa|Pegada um pouco mais aberta que os ombros. Suba até o queixo passar da barra, sem balançar, e desça com controle. Use elástico ou máquina assistida se precisar.
Costas|Pulldown com corda (braços estendidos)|Polia alta e corda|Braços quase estendidos, desça a corda até as coxas usando as costas (não os braços). Volte devagar.
Costas|Levantamento terra|Barra|Pés na largura do quadril, barra rente às canelas. Costas neutras, empurre o chão e estenda quadril e joelhos juntos. Desça com a barra colada ao corpo.
Costas|Hiperextensão lombar|Banco romano|Quadril apoiado, desça o tronco com coluna neutra e suba até alinhar com as pernas, sem exagerar na extensão.
Costas|Encolhimento de ombros (trapézio)|Halteres ou barra|Braços estendidos ao lado do corpo. Eleve os ombros em direção às orelhas, segure 1 segundo e desça. Sem girar os ombros.
Ombros|Desenvolvimento com halteres|Halteres e banco|Sentado, halteres na altura das orelhas. Empurre para cima sem bater os halteres e desça até 90° nos cotovelos.
Ombros|Desenvolvimento militar com barra|Barra|Em pé ou sentado, barra na frente dos ombros. Empurre acima da cabeça e desça até o queixo, abdômen firme.
Ombros|Desenvolvimento na máquina|Máquina|Ajuste o banco, empurre as manoplas para cima sem arquear a lombar e retorne devagar.
Ombros|Arnold press|Halteres|Comece com as palmas voltadas para você e gire as mãos para fora enquanto empurra para cima. Faça o caminho inverso na descida.
Ombros|Elevação lateral com halteres|Halteres|Cotovelos levemente flexionados, eleve os halteres até a altura dos ombros. Desça devagar, sem balançar o tronco.
Ombros|Elevação lateral na polia|Polia baixa|De lado para a polia, eleve o braço até a altura do ombro com tensão contínua. Controle a volta.
Ombros|Elevação frontal com halteres|Halteres|Eleve o halter à frente até a altura dos ombros, braço quase estendido. Desça controlando.
Ombros|Crucifixo inverso na máquina|Máquina (peck deck)|De frente para o apoio, abra os braços para trás aproximando as escápulas. Foco no ombro posterior.
Ombros|Crucifixo inverso com halteres|Halteres|Tronco inclinado à frente, abra os braços para os lados até a linha dos ombros e desça devagar.
Ombros|Remada alta|Barra ou polia|Pegada na largura dos ombros. Suba a barra rente ao corpo até a altura do peito, cotovelos acima das mãos.
Ombros|Face pull|Polia e corda|Corda na altura do rosto. Puxe em direção ao rosto abrindo os cotovelos para os lados. Ótimo para postura e ombro posterior.
Bíceps|Rosca direta com barra|Barra reta|Em pé, cotovelos colados ao corpo. Suba a barra até o peito e desça devagar sem balançar o tronco.
Bíceps|Rosca direta com barra W|Barra W|Mesmo movimento da rosca direta, com pegada mais confortável para os punhos.
Bíceps|Rosca alternada com halteres|Halteres|Suba um halter por vez girando o punho (palma para cima) ao subir. Desça controlando.
Bíceps|Rosca martelo|Halteres|Pegada neutra (palmas uma para a outra). Suba o halter sem girar o punho, cotovelo parado. Trabalha braquial e antebraço.
Bíceps|Rosca martelo na corda (polia)|Polia baixa e corda|Cotovelos colados ao corpo, puxe a corda para cima com pegada neutra e volte devagar.
Bíceps|Rosca Scott|Banco Scott e barra W|Axilas apoiadas no banco. Suba a barra e desça quase até estender, sem perder a tensão.
Bíceps|Rosca Scott na máquina|Máquina|Braços apoiados no pad. Flexione os cotovelos até contrair o bíceps e volte alongando devagar.
Bíceps|Rosca concentrada|Halter e banco|Sentado, cotovelo apoiado na parte interna da coxa. Suba o halter até o ombro e desça lentamente.
Bíceps|Rosca na polia baixa|Polia e barra|Cotovelos junto ao corpo, suba a barra mantendo tensão constante do cabo.
Bíceps|Rosca inclinada com halteres|Halteres e banco inclinado|Banco a 45°, braços pendendo para trás. Suba os halteres sem mover os cotovelos para frente. Alongamento máximo do bíceps.
Tríceps|Tríceps pulley com barra|Polia alta e barra|Cotovelos colados ao corpo. Estenda os braços para baixo até travar levemente e volte até 90°.
Tríceps|Tríceps corda|Polia alta e corda|Estenda os braços para baixo abrindo a corda no final do movimento. Cotovelos fixos.
Tríceps|Tríceps pulley invertido|Polia alta e barra|Pegada supinada (palmas para cima). Estenda os braços para baixo mantendo os cotovelos junto ao corpo.
Tríceps|Tríceps testa com barra W|Barra W e banco|Deitado, braços apontando para cima. Dobre apenas os cotovelos levando a barra em direção à testa e estenda.
Tríceps|Tríceps francês com halter|Halter|Segure o halter com as duas mãos atrás da cabeça. Estenda os braços para cima mantendo os cotovelos apontados para frente.
Tríceps|Tríceps coice|Halter|Tronco inclinado, cotovelo junto ao corpo. Estenda o braço para trás até alinhar com o tronco.
Tríceps|Tríceps no banco (mergulho)|Banco|Mãos no banco atrás do corpo. Desça flexionando os cotovelos até 90° e suba estendendo-os.
Tríceps|Mergulho nas paralelas|Paralelas|Tronco ereto para focar tríceps. Desça até 90° nos cotovelos e suba sem travar com força.
Tríceps|Tríceps na máquina|Máquina|Cotovelos apoiados. Empurre as manoplas até estender os braços e volte devagar.
Tríceps|Supino fechado|Barra e banco|Mãos na largura dos ombros. Desça a barra até a base do peito, cotovelos próximos ao corpo, e empurre.
Antebraço|Rosca de punho|Barra ou halteres|Antebraços apoiados no banco, palmas para cima. Flexione apenas os punhos subindo a carga e desça devagar.
Antebraço|Rosca de punho inversa|Barra ou halteres|Palmas para baixo. Estenda os punhos para cima e desça controlando.
Antebraço|Rosca inversa com barra|Barra|Pegada pronada (palmas para baixo). Suba a barra com cotovelos fixos. Trabalha antebraço e braquial.
Antebraço|Caminhada do fazendeiro|Halteres pesados|Segure um halter em cada mão, ombros para trás e abdômen firme. Caminhe com passos curtos pelo tempo ou distância definidos.
Quadríceps|Agachamento livre com barra|Barra e rack|Barra apoiada nas costas, pés na largura dos ombros. Desça com quadril para trás e joelhos alinhados aos pés até as coxas ficarem paralelas ao chão e suba empurrando o chão.
Quadríceps|Agachamento no Smith|Smith|Pés um pouco à frente da barra. Desça controlando até 90° ou mais e suba sem travar os joelhos.
Quadríceps|Agachamento goblet|Halter ou kettlebell|Segure o peso junto ao peito. Desça com coluna reta e cotovelos entre os joelhos, suba empurrando o chão.
Quadríceps|Leg press 45°|Máquina|Pés na largura dos ombros na plataforma. Desça até 90° nos joelhos sem descolar o quadril do banco e empurre sem travar os joelhos.
Quadríceps|Leg press horizontal|Máquina|Mesma técnica do leg press 45°, com atenção para manter lombar e quadril apoiados.
Quadríceps|Hack machine|Máquina|Costas apoiadas, pés na plataforma. Desça controlando e suba empurrando com os calcanhares.
Quadríceps|Cadeira extensora|Máquina|Ajuste o encosto para o joelho alinhar com o eixo. Estenda as pernas, segure 1 segundo no topo e desça devagar.
Quadríceps|Afundo com halteres|Halteres|Dê um passo à frente e desça até ambos os joelhos formarem 90°. Empurre com a perna da frente para voltar.
Quadríceps|Passada caminhando|Halteres ou peso do corpo|Passos longos alternados, descendo o joelho de trás próximo ao chão. Tronco ereto.
Quadríceps|Agachamento búlgaro|Banco e halteres|Pé de trás apoiado no banco. Desça na perna da frente até 90° e suba empurrando com o calcanhar.
Quadríceps|Step-up (subida no banco)|Banco e halteres|Suba no banco empurrando com a perna da frente, sem impulso da perna de trás. Desça com controle.
Posterior de coxa|Mesa flexora|Máquina|Deitado de bruços, flexione os joelhos levando os calcanhares em direção ao glúteo. Desça devagar sem levantar o quadril.
Posterior de coxa|Cadeira flexora|Máquina|Sentado, flexione os joelhos puxando o pad para baixo e para trás. Retorne alongando devagar.
Posterior de coxa|Stiff com barra|Barra|Joelhos levemente flexionados, leve o quadril para trás deslizando a barra rente às pernas até sentir alongar o posterior. Suba contraindo glúteos.
Posterior de coxa|Stiff com halteres|Halteres|Mesmo movimento do stiff com barra, com halteres ao lado das pernas. Coluna sempre neutra.
Posterior de coxa|Levantamento terra romeno|Barra|Parte do alto com a barra. Quadril para trás, barra rente às coxas até abaixo dos joelhos, e retorne estendendo o quadril.
Glúteos|Elevação pélvica com barra|Barra e banco|Costas apoiadas no banco, barra sobre o quadril. Suba o quadril contraindo os glúteos até alinhar tronco e coxas e desça devagar.
Glúteos|Ponte de glúteo|Peso do corpo|Deitado, pés no chão. Suba o quadril apertando os glúteos no topo por 1-2 segundos e desça.
Glúteos|Glúteo na polia (coice)|Polia e tornozeleira|Apoie as mãos, chute a perna para trás estendendo o quadril sem arquear a lombar. Volte devagar.
Glúteos|Extensão de quadril na máquina|Máquina|Apoie o corpo e empurre a plataforma para trás com o glúteo. Controle a volta.
Glúteos|Cadeira abdutora|Máquina|Sentado, abra as pernas contra a resistência, tronco levemente inclinado à frente para enfatizar o glúteo. Volte devagar.
Glúteos|Cadeira adutora|Máquina|Sentado, aproxime as pernas contra a resistência e retorne de forma controlada. Trabalha a parte interna da coxa.
Glúteos|Agachamento sumô|Halter ou barra|Pés bem afastados e pontas para fora. Desça mantendo o tronco ereto e joelhos na direção dos pés. Foco em glúteos e adutores.
Panturrilha|Panturrilha em pé na máquina|Máquina|Ponta dos pés na plataforma. Suba o máximo possível, segure 1 segundo e desça alongando bem.
Panturrilha|Panturrilha sentado|Máquina|Joelhos a 90° sob o pad. Suba nos dedos e desça devagar com amplitude total. Foca o sóleo.

Funcional e mobilidade|Burpee|Peso do corpo|Agache, apoie as mãos, estenda as pernas para trás, faça uma flexão, volte e salte com os braços acima da cabeça.

    const norm = s => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
    const slug = s => norm(s).replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const $ = s => document.querySelector(s);
    const BUILTIN = RAW.trim().split('\n').map(l => { const [group, name, equip, instructions] = l.split('|'); return { id: slug(name), group, name, equip, instructions, custom: false } });

    const S = { user: null, role: null, profile: null, profileLoaded: false, students: [], workouts: [], logs: [], over: {}, cfg: {}, view: 'login', p: {}, draft: null, unsubs: [], lq: '', lg: '', pq: '', pg: '', sess: {} };

    function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('on'), 2600) }
    function modal(html) { $('#modal').innerHTML = `<div class="ov" data-act="closeModal"><div class="sheet">${html}</div></div>` }
    function closeModal() { $('#modal').innerHTML = '' }

    /* ---------- configuração pendente ---------- */
    const configured = !CONFIG.firebase.apiKey.startsWith('COLE') && !CONFIG.personalEmail.startsWith('COLE');
    if (!configured) {
      $('#app').innerHTML = `<div class="login"><h1>⚙️ Falta configurar</h1><p class="muted">Abra o arquivo <b>index.html</b>, procure o bloco <b>CONFIGURAÇÃO</b> no começo do script e cole os dados do seu projeto Firebase e o seu e-mail de personal. O passo a passo está no arquivo README.md.</p></div>`;
      throw new Error('Firebase não configurado');
    }
    const fbApp = initializeApp(CONFIG.firebase);
    const auth = getAuth(fbApp);

    /* ---------- biblioteca ---------- */
    function getLib() {
      const list = BUILTIN.map(b => { const o = S.over[b.id] || {}; return { ...b, equip: o.equip ?? b.equip, instructions: o.instructions ?? b.instructions, video: o.video || '', overridden: !!S.over[b.id] } });
      Object.values(S.over).forEach(o => { if (o.custom) list.push({ ...o, video: o.video || '' }) });
      return list.sort((a, b) => a.name.localeCompare(b.name, 'pt-BR'));
    }
    const libMap = () => Object.fromEntries(getLib().map(e => [e.id, e]));
    const ytLink = n => `https://www.youtube.com/results?search_query=${encodeURIComponent('como fazer ' + n + ' execução correta')}`;
    function waLink(text) { const n = String(S.cfg.whatsapp || '').replace(/\D/g, ''); return n ? `https://wa.me/${n}?text=${encodeURIComponent(text)}` : null }

    /* ---------- dados em tempo real ---------- */
    function listen() {
      const u = S.unsubs; const err = e => { console.error(e); toast('Erro ao carregar dados (' + (e.code || '') + ')') };
      u.push(onSnapshot(collection(db, 'exercises'), s => { S.over = {}; s.forEach(d => S.over[d.id] = { ...d.data(), id: d.id }); render() }, err));
      u.push(onSnapshot(doc(db, 'config', 'main'), s => { S.cfg = s.data() || {}; render() }, err));
      if (S.role === 'personal') {
        u.push(onSnapshot(collection(db, 'students'), s => { S.students = s.docs.map(d => ({ ...d.data(), id: d.id })); render() }, err));
        u.push(onSnapshot(collection(db, 'workouts'), s => { S.workouts = s.docs.map(d => ({ ...d.data(), id: d.id })); render() }, err));
        u.push(onSnapshot(collection(db, 'logs'), s => { S.logs = s.docs.map(d => ({ ...d.data(), id: d.id })); render() }, err));
      } else {
        const uid = S.user.uid;
        u.push(onSnapshot(doc(db, 'students', uid), s => { S.profile = s.exists() ? { ...s.data(), id: s.id } : null; S.profileLoaded = true; render() }, err));
        u.push(onSnapshot(query(collection(db, 'workouts'), where('studentId', '==', uid)), s => { S.workouts = s.docs.map(d => ({ ...d.data(), id: d.id })); render() }, err));
        u.push(onSnapshot(query(collection(db, 'logs'), where('studentId', '==', uid)), s => { S.logs = s.docs.map(d => ({ ...d.data(), id: d.id })); render() }, err));
      }
    }
    onAuthStateChanged(auth, u => {
      S.unsubs.forEach(f => f()); S.unsubs = []; S.user = u; S.profile = null; S.profileLoaded = false;
      if (!u) { S.role = null; S.view = 'login'; render(true); return }
      S.role = u.email.toLowerCase() === CONFIG.personalEmail.toLowerCase() ? 'personal' : 'student';
      S.view = S.role === 'personal' ? 'students' : 'home';
      listen(); render(true);

    /* ---------- layout ---------- */
    function shell(title, body, back) {
      const pers = S.role === 'personal';
      const items = pers ? [['students', '🧑‍🤝‍🧑', 'Alunos'], ['library', '📚', 'Exercícios'], ['settings', '⚙️', 'Ajustes']] : [['home', '🏋️', 'Treinos'], ['history', '📈', 'Histórico']];
      const cur = ({ student: 'students', wedit: 'students', sworkout: 'home' })[S.view] || S.view;
      return `<header>${back ? `<button class="ico" data-act="go" data-v="${back.v}" data-id="${back.id || ''}">‹</button>` : ''}<h2>${esc(title)}</h2></header><main>${body}</main>
  <nav>${items.map(i => `<button class="${cur === i[0] ? 'on' : ''}" data-act="go" data-v="${i[0]}"><span>${i[1]}</span>${i[2]}</button>`).join('')}</nav>`;
    }
    function go(v, p) {
      S.view = v; S.p = p || {};
      if (v === 'wedit') { const w = S.workouts.find(x => x.id === S.p.id); if (w) S.draft = JSON.parse(JSON.stringify(w)) }
      render(true); window.scrollTo(0, 0);
    }
    function render(force) {
      const a = document.activeElement;
      if (!force && a && a.matches && a.matches('#app input,#app textarea,#app select')) return;
      const app = $('#app');
      if (!S.user) { app.innerHTML = loginView(); return }
      if (S.role === 'student' && S.profileLoaded && !S.profile) { app.innerHTML = shell('Conta sem cadastro', '<p class="muted">Seu cadastro não foi encontrado. Fale com seu personal.</p><button class="btn sec" data-act="logout">Sair</button>'); return }
      app.innerHTML = (views[S.view] || views.students)();
    }
    function loginView() {
      return `<div class="login"><h1>💪 Meu Treino</h1><p class="muted">Entre com o login que seu personal criou.</p>
<label>Login ou e-mail</label><input id="lg" autocapitalize="none" autocomplete="username" placeholder="ex: joao.silva">
<label>Senha</label><input id="pw" type="password" autocomplete="current-password" placeholder="Sua senha">
<button class="btn" data-act="login">Entrar</button><button class="link" data-act="forgot">Esqueci a senha</button></div>`}

    /* ---------- componentes ---------- */
    function exDetail(e, ex) {
      const vid = ex.video || ytLink(e.name);
      return `<p><b>Como fazer:</b> ${esc(ex.instructions || 'Sem instruções cadastradas.')}</p>${ex.equip ? `<p class="muted">Equipamento: ${esc(ex.equip)}</p>` : ''}`;
    }
    function pills(e) { return [e.sets ? `<span class="pill">${esc(e.sets)} séries</span>` : '', e.reps ? `<span class="pill">${esc(e.reps)} reps</span>` : '', e.load ? `<span class="pill">${esc(e.load)}</span>` : '', e.rest ? `<span class="pill">⏱ ${esc(e.rest)}</span>` : ''].join('') }
    function groupChips(act, cur) { return `<div class="chips"><button class="${!cur ? 'on' : ''}" data-act="${act}" data-g="">Todos</button>${GROUPS.map(g => `<button class="${cur === g ? 'on' : ''}" data-act="${act}" data-g="${esc(g)}">${esc(g)}</button>`).join('')}</div>` }
    const fmt = d => { try { return new Date(d).toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' }) } catch { return '' } };
    function logCard(l) {
      const done = (l.entries || []).filter(x => x.done).length;
      return `<div class="card click" data-act="toggle"><div class="row"><b class="grow">${esc(l.workoutName)}</b><span class="tag">${done}/${(l.entries || []).length}</span></div><div class="muted">${fmt(l.date)}</div>
  <div class="det hidden">${(l.entries || []).map(x => `<div>${x.done ? '✅' : '⬜'} ${esc(x.name)}${x.load ? ` — <b>${esc(x.load)}</b>` : ''}</div>`).join('')}</div></div>`;
    }

    /* ---------- telas ---------- */
    const views = {
      students() {
        const list = [...S.students].sort((a, b) => a.name.localeCompare(b.name, 'pt-BR'));
        return shell('Meus alunos', `<button class="btn" data-act="newStudent">+ Novo aluno</button>` + (list.length ? list.map(s => `<div class="card click" data-act="go" data-v="student" data-id="${s.id}"><b>${esc(s.name)}</b><div class="muted">${esc(s.goal || 'Sem objetivo definido')} · ${S.workouts.filter(w => w.studentId === s.id).length} treinos</div></div>`).join('') : '<p class="muted">Nenhum aluno ainda. Toque em “+ Novo aluno”.</p>'));
      },
      student() {
        const s = S.students.find(x => x.id === S.p.id);
        if (!s) return shell('Aluno', '<p class="muted">Aluno não encontrado.</p>', { v: 'students' });
        const ws = S.workouts.filter(w => w.studentId === s.id).sort((a, b) => (a.order || 0) - (b.order || 0));
        const ls = S.logs.filter(l => l.studentId === s.id).sort((a, b) => String(b.date).localeCompare(String(a.date))).slice(0, 15);
        return shell(s.name, `<div class="card"><div class="muted">Login: <b>${esc(s.login)}</b></div><div>${esc(s.goal || '')}</div>${s.notes ? `<div class="muted">${esc(s.notes)}</div>` : ''}
    <button class="btn sec sm" data-act="editStudent" data-id="${s.id}">Editar dados</button><button class="btn red sm" data-act="delStudent" data-id="${s.id}">Excluir aluno</button></div>
    <h3>Treinos</h3><button class="btn" data-act="newWorkout" data-id="${s.id}">+ Novo treino</button>
    ${ws.map(w => `<div class="card"><b>${esc(w.name)}</b><div class="muted">${(w.exercises || []).length} exercícios</div>
    <button class="btn sm" data-act="go" data-v="wedit" data-id="${w.id}">Editar</button><button class="btn sec sm" data-act="dupWorkout" data-id="${w.id}">Copiar</button><button class="btn red sm" data-act="delWorkout" data-id="${w.id}">Excluir</button></div>`).join('') || '<p class="muted">Nenhum treino ainda.</p>'}
    <h3>Últimos treinos feitos</h3>${ls.map(logCard).join('') || '<p class="muted">Ainda sem registros.</p>'}`, { v: 'students' });
      },
      wedit() {
        const d = S.draft; if (!d) return views.students();
        return shell('Editar treino', `<label>Nome do treino</label><input id="wname" value="${esc(d.name)}" placeholder="Ex: Treino A - Bíceps e costas">
    ${d.exercises.map((e, i) => `<div class="card"><div class="row"><b class="grow">${i + 1}. ${esc(e.name)}</b><button class="ico sm" data-act="mv" data-i="${i}" data-d="-1">↑</button><button class="ico sm" data-act="mv" data-i="${i}" data-d="1">↓</button><button class="ico sm" data-act="rm" data-i="${i}">✕</button></div>
    <div class="grid4"><div><label>Séries</label><input data-i="${i}" data-f="sets" inputmode="numeric" value="${esc(e.sets)}"></div><div><label>Reps</label><input data-i="${i}" data-f="reps" value="${esc(e.reps)}"></div><div><label>Carga</label><input data-i="${i}" data-f="load" value="${esc(e.load)}" placeholder="kg"></div><div><label>Desc.</label><input data-i="${i}" data-f="rest" value="${esc(e.rest)}"></div></div>
    <label>Observação para o aluno</label><textarea data-i="${i}" data-f="note" rows="2">${esc(e.note)}</textarea></div>`).join('') || '<p class="muted">Nenhum exercício ainda.</p>'}
    <button class="btn sec" data-act="openPicker">+ Adicionar exercício</button>
    <div class="savebar"><button class="btn" data-act="saveWorkout">Salvar treino</button></div>`, { v: 'student', id: d.studentId });
      },
      library() {
        return shell('Exercícios', `<input id="lq" placeholder="Buscar exercício..." value="${esc(S.lq)}">${groupChips('lgrp', S.lg)}<button class="btn sec" data-act="newEx">+ Novo exercício</button><div id="liblist">${libList()}</div>`);

      settings() {
        return shell('Ajustes', `<div class="card"><label>Seu nome (aparece para os alunos)</label><input id="cname" value="${esc(S.cfg.personalName || '')}">
    <label>Seu WhatsApp com DDI e DDD, só números</label><input id="cwa" inputmode="numeric" placeholder="5591999999999" value="${esc(S.cfg.whatsapp || '')}">
    <button class="btn" data-act="saveCfg">Salvar</button></div><button class="btn sec" data-act="logout">Sair da conta</button>`);
      },
      home() {
        const ws = [...S.workouts].sort((a, b) => (a.order || 0) - (b.order || 0));
        const wl = waLink(`Oi ${S.cfg.personalName || ''}! Aqui é ${S.profile ? S.profile.name : ''}.`);
        return shell(`Olá, ${(S.profile && S.profile.name || '').split(' ')[0]} 👋`, `${S.profile && S.profile.goal ? `<p class="muted">Objetivo: ${esc(S.profile.goal)}</p>` : ''}
    ${ws.map(w => `<div class="card click" data-act="go" data-v="sworkout" data-id="${w.id}"><b>${esc(w.name)}</b><div class="muted">${(w.exercises || []).length} exercícios</div></div>`).join('') || '<p class="muted">Seu personal ainda não montou seu treino.</p>'}
    ${wl ? `<a class="btn sec" target="_blank" rel="noopener" href="${wl}">💬 Falar com meu personal</a>` : ''}
    <button class="link" data-act="logout">Sair</button>`);
      },

        const w = S.workouts.find(x => x.id === S.p.id); if (!w) return views.home();

      <label style="margin-top:8px">Carga que usei hoje</label><input data-sf="load" data-i="${i}" value="${esc(s.load || '')}" placeholder="Ex: 20kg">
      <button class="btn sec sm" data-act="toggle">ℹ️ Como fazer</button><a class="btn sec sm" target="_blank" rel="noopener" href="${esc(vid)}">▶ Ver execução</a>${wl ? `<a class="btn sec sm" target="_blank" rel="noopener" href="${wl}">💬 Tirar dúvida</a>` : ''}
      <div class="det hidden">${exDetail(e, ex)}</div></div>`
        }).join('') + `<button class="btn" data-act="finish" data-id="${w.id}">✅ Finalizar treino</button>`, { v: 'home' });
      },
      history() {
        const ls = [...S.logs].sort((a, b) => String(b.date).localeCompare(String(a.date)));
        return shell('Histórico', ls.map(logCard).join('') || '<p class="muted">Você ainda não finalizou nenhum treino.</p>');
      }
    };
    function libList() {

      return l.map(e => `<div class="card click" data-act="toggle"><div class="row"><b class="grow">${esc(e.name)}</b><span class="tag">${esc(e.group)}</span></div>

    }

    /* ---------- sessão do aluno (treino em andamento) ---------- */
    function getSess(id) { if (!S.sess[id]) { try { S.sess[id] = JSON.parse(localStorage.getItem('sess_' + id) || '{}') } catch { S.sess[id] = {} } } return S.sess[id] }
    function saveSess(id) { try { localStorage.setItem('sess_' + id, JSON.stringify(S.sess[id])) } catch { } }

    }

    /* ---------- ações ---------- */
    async function doLogin() {
      const l = $('#lg').value.trim().toLowerCase(), pw = $('#pw').value; if (!l || !pw) return toast('Preencha login e senha');
      try { await signInWithEmailAndPassword(auth, l.includes('@') ? l : l + '@aluno.fit', pw) } catch (e) { toast('Login ou senha incorretos') }
    }
    function studentForm(s) {
      s = s || {};
      return `<h3>${s.id ? 'Editar aluno' : 'Novo aluno'}</h3><label>Nome</label><input id="sn" value="${esc(s.name || '')}">
  ${s.id ? '' : `<label>Login (sem espaços, ex: maria.souza) ou e-mail</label><input id="sl" autocapitalize="none"><label>Senha (mínimo 6 caracteres)</label><input id="sp" type="text" autocapitalize="none">`}
  <label>Objetivo</label><input id="sg" value="${esc(s.goal || '')}" placeholder="Ex: hipertrofia, emagrecimento"><label>Observações (lesões, rotina...)</label><textarea id="so" rows="3">${esc(s.notes || '')}</textarea>
  <button class="btn" data-act="saveStudent" data-id="${s.id || ''}">Salvar</button><button class="btn sec" data-act="closeModal">Cancelar</button>`;
    }
    async function createStudent() {
      const name = $('#sn').value.trim(), login = $('#sl').value.trim().toLowerCase(), pw = $('#sp').value, goal = $('#sg').value.trim(), notes = $('#so').value.trim();
      if (!name) return toast('Informe o nome');
      if (!login.includes('@') && !/^[a-z0-9._-]{3,}$/.test(login)) return toast('Login: use letras minúsculas, números, ponto ou traço (mín. 3)');
      if (pw.length < 6) return toast('Senha com no mínimo 6 caracteres');
      const email = login.includes('@') ? login : login + '@aluno.fit';
      const sec = initializeApp(CONFIG.firebase, 'sec' + Date.now()), sa = getAuth(sec); let uid;
      try {
        try { uid = (await createUserWithEmailAndPassword(sa, email, pw)).user.uid }
        catch (e) {
          if (e.code === 'auth/email-already-in-use') { try { uid = (await signInWithEmailAndPassword(sa, email, pw)).user.uid } catch { return toast('Esse login já existe com outra senha. Use outro login.') } }
          else return toast('Erro ao criar login: ' + (e.code || ''));
        }
        await signOut(sa);
        await setDoc(doc(db, 'students', uid), { name, login, goal, notes, createdAt: serverTimestamp() });
        closeModal(); toast('Aluno criado! Passe o login e a senha para ele.');
      } finally { deleteApp(sec).catch(() => { }) }
    }
    const actions = {
      login: doLogin,
      forgot: async () => { const l = ($('#lg').value || '').trim().toLowerCase(); if (!l.includes('@')) return toast('Digite seu e-mail no campo de login para receber o link'); try { await sendPasswordResetEmail(auth, l); toast('Enviamos um e-mail de redefinição') } catch { toast('Não foi possível enviar') } },
      logout: () => signOut(auth),
      go: t => go(t.dataset.v, { id: t.dataset.id }),
      closeModal: (t, e) => { if (t.classList.contains('ov') && e.target !== t) return; closeModal() },
      toggle: (t, e) => { if (e.target.closest('a,button.btn:not([data-act=toggle]),input')) return; const c = t.closest('.card'); const d = c.querySelector('.det'); if (d) d.classList.toggle('hidden') },
      newStudent: () => modal(studentForm()),
      editStudent: t => modal(studentForm(S.students.find(x => x.id === t.dataset.id))),
      saveStudent: async t => {
        if (!t.dataset.id) return createStudent();
        const name = $('#sn').value.trim(); if (!name) return toast('Informe o nome');
        await setDoc(doc(db, 'students', t.dataset.id), { name, goal: $('#sg').value.trim(), notes: $('#so').value.trim() }, { merge: true }); closeModal(); toast('Salvo');
      },
      delStudent: async t => {
        if (!confirm('Excluir este aluno e todos os treinos e registros dele?')) return;
        const id = t.dataset.id, b = writeBatch(db);
        S.workouts.filter(w => w.studentId === id).forEach(w => b.delete(doc(db, 'workouts', w.id)));
        S.logs.filter(l => l.studentId === id).forEach(l => b.delete(doc(db, 'logs', l.id)));
        b.delete(doc(db, 'students', id)); await b.commit(); go('students'); toast('Aluno excluído');
      },
      newWorkout: t => modal(`<h3>Novo treino</h3><label>Nome</label><input id="wn" value="Treino A" placeholder="Ex: Treino de bíceps"><button class="btn" data-act="createWorkout" data-id="${t.dataset.id}">Criar e adicionar exercícios</button><button class="btn sec" data-act="closeModal">Cancelar</button>`),
      createWorkout: async t => {
        const name = $('#wn').value.trim() || 'Treino', studentId = t.dataset.id, order = Date.now();
        const ref = await addDoc(collection(db, 'workouts'), { studentId, name, exercises: [], order, createdAt: serverTimestamp() });
        closeModal(); S.draft = { id: ref.id, studentId, name, exercises: [], order }; S.view = 'wedit'; S.p = { id: ref.id }; render(true); window.scrollTo(0, 0);
      },
      delWorkout: async t => { if (confirm('Excluir este treino?')) { await deleteDoc(doc(db, 'workouts', t.dataset.id)); toast('Treino excluído') } },
      dupWorkout: t => {
        const opts = [...S.students].sort((a, b) => a.name.localeCompare(b.name, 'pt-BR')).map(s => `<option value="${s.id}">${esc(s.name)}</option>`).join('');
        modal(`<h3>Copiar treino para</h3><select id="dto">${opts}</select><button class="btn" data-act="doDup" data-id="${t.dataset.id}">Copiar</button><button class="btn sec" data-act="closeModal">Cancelar</button>`);
      },
      doDup: async t => {
        const w = S.workouts.find(x => x.id === t.dataset.id); if (!w) return;
        await addDoc(collection(db, 'workouts'), { studentId: $('#dto').value, name: w.name, exercises: w.exercises, order: Date.now(), createdAt: serverTimestamp() }); closeModal(); toast('Treino copiado');
      },
      openPicker,
      pick: t => {
        const e = libMap()[t.dataset.id]; if (!e || !S.draft) return;
        const cardio = e.group === 'Cardio';
        S.draft.exercises.push({ key: e.id, name: e.name, group: e.group, sets: cardio ? '1' : '3', reps: cardio ? '20 min' : '10-12', load: '', rest: cardio ? '' : '60s', note: '' });
        render(true); toast('Adicionado: ' + e.name);
      },
      pgrp: t => { S.pg = t.dataset.g; renderPicker() },
      lgrp: t => { S.lg = t.dataset.g; render(true) },
      mv: t => { const i = +t.dataset.i, j = i + +t.dataset.d, a = S.draft.exercises; if (j < 0 || j >= a.length) return;[a[i], a[j]] = [a[j], a[i]]; render(true) },
      rm: t => { S.draft.exercises.splice(+t.dataset.i, 1); render(true) },
      saveWorkout: async () => {
        const { id, createdAt, ...data } = S.draft; data.name = (data.name || '').trim() || 'Treino';
        await setDoc(doc(db, 'workouts', id), data, { merge: true }); toast('Treino salvo ✔'); go('student', { id: data.studentId });
      },
      newEx: () => modal(exForm({ custom: true })),
      editEx: t => modal(exForm(libMap()[t.dataset.id])),
      saveEx: async t => {
        const id = t.dataset.id, custom = t.dataset.custom === '1';
        const data = { equip: $('#xe').value.trim(), instructions: $('#xi').value.trim(), video: $('#xv').value.trim() };
        if (custom) { const name = $('#xn').value.trim(); if (!name) return toast('Informe o nome'); Object.assign(data, { name, group: $('#xg').value, custom: true }) }
        await setDoc(doc(db, 'exercises', id || 'c_' + Date.now()), data, { merge: true }); closeModal(); toast('Exercício salvo');
      },
      delEx: async t => { if (confirm(t.dataset.custom === '1' ? 'Excluir este exercício?' : 'Restaurar o padrão deste exercício?')) { await deleteDoc(doc(db, 'exercises', t.dataset.id)); closeModal() } },
      saveCfg: async () => { await setDoc(doc(db, 'config', 'main'), { personalName: $('#cname').value.trim(), whatsapp: $('#cwa').value.replace(/\D/g, '') }); toast('Salvo ✔') },
      chk: t => { const w = S.p.id, s = getSess(w); s[t.dataset.i] = s[t.dataset.i] || {}; s[t.dataset.i].done = t.checked; saveSess(w); t.closest('.card').classList.toggle('done', t.checked) },
      finish: async t => {
        const w = S.workouts.find(x => x.id === t.dataset.id), ss = getSess(w.id);
        const entries = w.exercises.map((e, i) => ({ name: e.name, done: !!(ss[i] && ss[i].done), load: (ss[i] && ss[i].load) || '' }));
        await addDoc(collection(db, 'logs'), { studentId: S.user.uid, workoutId: w.id, workoutName: w.name, date: new Date().toISOString(), entries });
        S.sess[w.id] = {}; saveSess(w.id); toast('Treino registrado! 💪'); go('home');
      }
    };
    function exForm(e) {
      e = e || {}; const custom = !!e.custom;
      return `<h3>${e.id ? 'Editar exercício' : 'Novo exercício'}</h3>
  ${custom ? `<label>Nome</label><input id="xn" value="${esc(e.name || '')}"><label>Grupo muscular</label><select id="xg">${GROUPS.map(g => `<option ${e.group === g ? 'selected' : ''}>${esc(g)}</option>`).join('')}</select>` : `<p><b>${esc(e.name)}</b> <span class="tag">${esc(e.group)}</span></p>`}
  <label>Equipamento</label><input id="xe" value="${esc(e.equip || '')}"><label>Instruções</label><textarea id="xi" rows="5">${esc(e.instructions || '')}</textarea>
  <label>Link do vídeo (YouTube). Vazio = busca automática</label><input id="xv" autocapitalize="none" value="${esc(e.video || '')}" placeholder="https://youtu.be/...">
  <button class="btn" data-act="saveEx" data-id="${esc(e.id || '')}" data-custom="${custom ? 1 : 0}">Salvar</button>
  ${e.id && (custom || e.overridden) ? `<button class="btn red" data-act="delEx" data-id="${esc(e.id)}" data-custom="${custom ? 1 : 0}">${custom ? 'Excluir exercício' : 'Restaurar padrão'}</button>` : ''}
  <button class="btn sec" data-act="closeModal">Cancelar</button>`;
    }

    /* ---------- eventos globais ---------- */
    document.addEventListener('click', e => { const t = e.target.closest('[data-act]'); if (!t) return; const f = actions[t.dataset.act]; if (f) f(t, e) });
    document.addEventListener('input', e => {
      const t = e.target;
      if (t.dataset.f && S.draft) { S.draft.exercises[t.dataset.i][t.dataset.f] = t.value }
      else if (t.id === 'wname' && S.draft) S.draft.name = t.value;
      else if (t.dataset.sf) { const w = S.p.id, s = getSess(w); s[t.dataset.i] = s[t.dataset.i] || {}; s[t.dataset.i][t.dataset.sf] = t.value; saveSess(w) }
      else if (t.id === 'pq') { S.pq = t.value; renderPicker() }
      else if (t.id === 'lq') { S.lq = t.value; $('#liblist').innerHTML = libList() }
    });
    document.addEventListener('keydown', e => { if (e.key === 'Enter' && (e.target.id === 'pw' || e.target.id === 'lg')) doLogin() });
    render(true);
  </script>
</body>

</html>
